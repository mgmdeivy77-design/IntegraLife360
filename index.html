{n:"Desarrollo profesional",s:"Carrera",q:["Mi trabajo o estudio me motiva","Desarrollo mis habilidades de forma deliberada","Tengo claro mi siguiente paso profesional"],r:"Define un objetivo a mediano plazo con etapas y fecha para tu siguiente paso profesional."},

{n:"Organización y productividad",s:"Orden",q:["Planifico mi semana con anticipación","Cumplo lo que me propongo","Gestiono bien mi tiempo y mis distracciones"],r:"Usa la Agenda: elige máximo 3 tareas prioritarias por día y revisa las atrasadas cada semana."},
{n:"Recreación y crecimiento personal",s:"Ocio",q:["Disfruto de pasatiempos con regularidad","Descanso sin culpa","Me doy espacio para experiencias nuevas"],r:"Programa una actividad recreativa semanal como una tarea fija."}];
const REF=[["Fortalezas y debilidades","¿En qué soy bueno y qué me cuesta? ¿Qué dicen las personas cercanas?"],["Valores personales","¿Qué es no negociable para mí? ¿Cuándo he sentido orgullo de mis decisiones?"],["Motivaciones","¿Qué me impulsa a actuar sin que me obliguen?"],["Creencias limitantes","¿Qué frases me digo que me frenan (“yo no puedo…”)? ¿Qué evidencia real las sostiene?"],["Patrones de comportamiento","¿Qué repito en situaciones de estrés, y qué resultado me da?"],["Áreas que necesitan atención","¿Qué área de mi vida estoy postergando?"],["Propósito y dirección","¿Qué quiero que sea cierto de mi vida dentro de 5 años?"]];

{id:"vida101",tp:"sleep",t:"Vida saludable 101: bases para cuerpo y mente",d:"Descubre los pilares de la salud física y mental y cómo construir hábitos duraderos.",L:[
["¿Qué significa estar saludable?","La salud no es solo la ausencia de enfermedad: incluye el bienestar físico, mental y social. Cuatro pilares influyen en casi todo lo demás: la alimentación, el movimiento, el sueño y el cuidado de tu mente. Están conectados: dormir mal suele aumentar el estrés, y el estrés cambia lo que comes. Evalúa cómo estás en cada uno sin juzgarte y elige solo uno para mejorar primero."],
["El papel de la alimentación","No necesitas una dieta perfecta. Las guías generales de salud coinciden en priorizar alimentos poco procesados (verduras, frutas, legumbres, cereales integrales, proteínas variadas) y limitar azúcares añadidos y ultraprocesados. Un cambio pequeño y sostenible, como añadir una verdura a la cena, vale más que un plan estricto que abandonas en una semana. Si tienes una condición médica, consulta a un profesional antes de cambiar tu dieta."],
["Moverte: por qué importa y cómo encontrar lo tuyo","La OMS recomienda a los adultos entre 150 y 300 minutos semanales de actividad aeróbica moderada, más ejercicios de fuerza al menos dos días a la semana. La mejor actividad es la que realmente haces: caminar, bailar, bicicleta, deporte. Empieza con 10 minutos y conviértelo en un hábito desde el botón +."],
["Cuidar tu mente","La salud mental también se entrena: registra tu estado de ánimo, mantén vínculos con personas de confianza, reserva tiempo de descanso y pide ayuda cuando el malestar sea intenso o dure semanas. Esta app es psicoeducativa y no reemplaza la atención profesional. Consultar a un psicólogo o a un médico es una señal de cuidado."]]},
{id:"sueno",tp:"sleep",t:"Mejor sueño: guía práctica",d:"Rutinas y técnicas para dormir mejor, basadas en las recomendaciones habituales de la medicina del sueño.",L:[
["Cuántas horas necesitas","La mayoría de los adultos necesita entre 7 y 9 horas, según las sociedades médicas del sueño, con variación individual. Una buena señal es despertar descansado y funcionar bien de día sin depender de la cafeína. Calcula tu hora de dormir contando hacia atrás desde la hora en que debes levantarte."],
["Horarios regulares","El reloj biológico responde a la regularidad. Acostarte y levantarte a horas parecidas, incluso en fin de semana, ayuda a dormirte antes y mejor. La luz natural por la mañana refuerza ese ritmo. Elige una hora fija para levantarte y mantenla durante una semana."],
["Tu dormitorio","Un cuarto oscuro, silencioso y fresco favorece el sueño. Reserva la cama para dormir y descansar, no para trabajar. Si no te duermes en unos 20 minutos, levántate, haz algo tranquilo con poca luz y vuelve cuando tengas sueño."],
["Qué evitar por la noche","La cafeína puede afectar el sueño horas después de tomarla: evítala desde la tarde. El alcohol puede adormecerte, pero fragmenta el sueño. Las pantallas y la luz intensa en la hora previa pueden retrasar el sueño: cambia el celular por una lectura ligera."],
["Calmar la mente antes de dormir","Si los pensamientos te mantienen despierto, escribe diez minutos antes de acostarte lo pendiente y lo que te preocupa. Luego respira lento: inhala 4 segundos, exhala 6, durante 3 minutos. Si el insomnio dura más de unas semanas o afecta tu día, consulta a un profesional."]]},
{id:"liderazgo",tp:"lead",t:"Liderazgo: fundamentos",d:"Habilidades esenciales para guiar personas y equipos.",L:[

{id:"habitos",tp:"science",t:"Ciencia de los hábitos",d:"Qué dice la investigación sobre cambiar conductas.",L:[
["Cuánto tarda un hábito","Un estudio de Lally y colegas (2010) siguió a personas que adoptaron una conducta diaria y halló que automatizarla tardó en promedio 66 días, con un rango muy amplio (de 18 a 254 días). No existe un número mágico como “21 días”. Lo que cuenta es la repetición constante."],
["Metas específicas","La investigación sobre fijación de metas (Locke y Latham) indica que las metas específicas y desafiantes, pero alcanzables, suelen mejorar el rendimiento más que las vagas. Convierte “ponerme en forma” en “caminar 30 minutos lunes, miércoles y viernes”."],
["Intenciones de implementación","Formular un plan “si ocurre X, entonces hago Y” aumenta la probabilidad de actuar, según estudios de Peter Gollwitzer. Ejemplo: “después de cenar, camino 10 minutos”. Conecta tu hábito nuevo con algo que ya haces cada día."],

{id:"estres",tp:"stress",t:"Manejo del estrés",d:"Reconoce el estrés y practica herramientas sencillas.",L:[

["Identifica tus disparadores","Usa el registro de ánimo y anota las situaciones estresantes. Tras unas semanas verás patrones: personas, horarios, tareas. Distingue lo que puedes cambiar, lo que puedes influir y lo que debes aceptar."],
["Respiración y pausas","Una exhalación más larga que la inhalación puede ayudar a calmar la activación del cuerpo. Prueba: inhala 4 segundos, exhala 6, durante tres minutos. Añade micropausas de uno o dos minutos entre tareas exigentes."],
["Cuándo pedir ayuda","Busca apoyo profesional si el estrés o la ansiedad interfieren con tu trabajo, tus relaciones o tu sueño durante semanas. Si piensas en hacerte daño, contacta de inmediato a los servicios de emergencia de tu país o a una persona de confianza. Esta app no ofrece diagnóstico ni tratamiento."]]},

profile(){return hd("Perfil")+`<div class="card"><input id="nm" placeholder="Tu nombre" value="${esc(S.name)}" aria-label="Nombre"><button class="pri" data-a="name">Guardar nombre</button><button data-a="theme" style="width:100%">Tema: ${{auto:"automático",light:"claro",dark:"oscuro"}[S.theme]}</button><button data-a="copy" style="width:100%">Copiar informe</button> <span class="sub" id="cm"></span><h3 style="margin-top:16px">IA con Gemini</h3><p class="sub">Para usar IA fuera del visor de Claude, pega tu clave de la API de Gemini. Se guarda solo en este dispositivo (en el navegador, sin cifrar) y no va dentro del archivo. Al usar la IA, tus mensajes y datos del Coach se envían a Google. Restringe la clave en Google AI Studio y no la compartas.</p><input id="gk" type="password" autocomplete="off" placeholder="Clave de API de Gemini" value="${esc(S.gk||"")}" aria-label="Clave de API"><input id="gm" placeholder="Modelo (ej.: gemini-3.5-flash)" value="${esc(S.gm||"gemini-3.5-flash")}" aria-label="Modelo"><div class="row"><button class="chip2" data-a="gsave">Guardar</button><button class="chip2" data-a="gtest">Probar</button><button class="chip2" data-a="gdel">Quitar clave</button></div><p class="sub" id="gs">${aistat()}</p><h3 style="margin-top:16px">Respaldo de datos</h3><p class="sub">Exporta tus datos para pasarlos a otra dirección o dispositivo. No incluye tu clave de Gemini. Las fotos y notas de voz hacen el respaldo más pesado.</p><div class="row"><button class="chip2" data-a="bexp">Descargar respaldo</button><button class="chip2" data-a="bcopy">Copiar respaldo</button></div><textarea id="bt" placeholder="Para importar, pega aquí un respaldo o elige un archivo" aria-label="Respaldo"></textarea><input type="file" id="bf" accept="application/json,.json" hidden onchange="bfile(this)"><div class="row"><button class="chip2" data-a="bpick">Elegir archivo</button><button class="chip2" data-a="bimp">Importar</button></div><p class="sub" id="bm"></p><button data-a="wipe"
